name: Build APK and desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty or missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sysref.jks"
          if [ ! -s "$RUNNER_TEMP/sysref.jks" ]; then
            echo "::error::KEYSTORE_BASE64 does not decode to a keystore"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/sysref.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk "sysref-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sysref-apk
          path: sysref-*.apk
          retention-days: 3

  desktop-linux:
    name: Linux DEB, RPM, tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      - name: Collect packages
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/
          tar -C desktop/build/compose/binaries/main/app -czf "dist/sysref-${GITHUB_REF_NAME//\//-}-linux-x64.tar.gz" SYSREF
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sysref-linux
          path: dist/*
          retention-days: 3

  desktop-windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Package MSI
        shell: bash
        run: ./gradlew :desktop:packageMsi

      - name: Collect package
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sysref-windows
          path: dist/*
          retention-days: 3

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: dist/*
          generate_release_notes: true
