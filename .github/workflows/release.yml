name: Build APK and desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is empty or missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sysref.jks"
          if [ ! -s "$RUNNER_TEMP/sysref.jks" ]; then
            echo "::error::KEYSTORE_BASE64 does not decode to a keystore"
            exit 1
          fi

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/sysref.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk "sysref-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sysref-apk
          path: sysref-*.apk
          retention-days: 3

  desktop-linux:
    name: Linux DEB, RPM, tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      - name: Collect packages
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/
          tar -C desktop/build/compose/binaries/main/app -czf "dist/sysref-${GITHUB_REF_NAME//\//-}-linux-x64.tar.gz" SYSREF
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sysref-linux
          path: dist/*
          retention-days: 3

  desktop-windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Package MSI
        shell: bash
        run: ./gradlew :desktop:packageMsi

      - name: Collect package
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sysref-windows
          path: dist/*
          retention-days: 3

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          generate_release_notes: true
