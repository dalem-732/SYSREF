name: Build APK and desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/sysref.jks

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/sysref.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Rename APK
        # ref_name is the tag (v1.2.0) or, for manual runs, a branch that may contain "/".
        run: cp app/build/outputs/apk/release/*.apk "sysref-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sysref-apk
          path: sysref-*.apk
          retention-days: 3

  desktop-linux:
    name: Linux DEB, RPM, tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Test and package
        run: |
          chmod +x gradlew
          ./gradlew :shared:desktopTest :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable

      - name: Collect packages
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb dist/
          cp desktop/build/compose/binaries/main/rpm/*.rpm dist/
          tar -C desktop/build/compose/binaries/main/app -czf "dist/sysref-${GITHUB_REF_NAME//\//-}-linux-x64.tar.gz" SYSREF
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sysref-linux
          path: dist/*
          retention-days: 3

  desktop-windows:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Package MSI
        shell: bash
        run: ./gradlew :desktop:packageMsi

      - name: Collect package
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: sysref-windows
          path: dist/*
          retention-days: 3

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
